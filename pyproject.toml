[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse"
version = "0.1.0"
description = "Graph-based code intelligence engine for token-efficient AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "OptiAgent Contributors" },
]
keywords = ["code-search", "code-intelligence", "ai-agents", "mcp", "token-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "model2vec>=0.4.0",
    "rank-bm25>=0.2.2",
    "rustworkx>=0.16.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "numpy>=1.26.0",
    "tokenizers>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.8.0",
]
mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
synapse = "synapse.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["synapse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
